; PlatformIO 工程配置 —— 极米 Play5 米家语音控制桥
; 板子：ESP32-D0WD-V3（常见 ESP32 DevKit / NodeMCU-32S，双核 240MHz）

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800

; 4MB Flash，默认分区表即可
board_build.partitions = default.csv

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    ; 只保留"扫描(observer) + 广播(broadcaster)"两种角色，省 Flash 和内存
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    ; 配网页面用中文文案（include/wm_strings_zh.h）
    -Iinclude
    -DWM_STRINGS_FILE='"wm_strings_zh.h"'

lib_deps =
    knolleary/PubSubClient@^2.8
    h2zero/NimBLE-Arduino@^1.4.3
    tzapu/WiFiManager@^2.0.17
